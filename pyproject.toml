[tool.poetry]
name = "TPFA-ResSim"
version = "0.1.1"
description = """Toy petroleum reservoir simulator using TPFA."""
authors = ["patnr <patrick.n.raanes@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "TPFA_ResSim"}]

[tool.poetry.dependencies]
# Try to keep compatible with Colab's environment, w/o needed many re-installs
python = ">=3.9,<3.12"
matplotlib = "~=3.7"
scipy = "~=1.10"
tqdm = "~=4.65"
struct-tools = "^0.2.7"
mpl-tools = "^0.4.0"

[tool.poetry.group.dev.dependencies]
ipython = "*"
pre-commit = "^2.20.0"
pdbpp = "^0.10.3"
pytest = "^7.1.3"
ruff = "*"
ipdb = "^0.13.9"
pdoc = "^14.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


#############
#  Linting  #
#############
[tool.autopep8]
max_line_length = 88
ignore = "W6"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Pinned to the classic pyflakes + pycodestyle-errors selection (the coverage
# of the old flakeheaven config). Notably, this excludes the whitespace (E1,
# E2) and blank-line (E3) rules, so as to allow operator/array alignment.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F401", # imported but unused
    "E731", # don't assign lambda
]


#############
#  Testing  #
#############
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "tests --doctest-modules TPFA_ResSim"
