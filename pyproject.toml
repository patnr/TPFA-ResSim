[project]
name = "TPFA-ResSim"
version = "0.2.0"
description = "Toy petroleum reservoir simulator using TPFA."
authors = [{name = "patnr", email = "patrick.n.raanes@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
# Try to keep compatible with Colab's environment, w/o needed many re-installs
# (its runtime of 2026.07 uses Python 3.12)
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "scipy~=1.10",
    "tqdm~=4.65",
    "mpl-tools>=0.4.0,<0.5",
]

[dependency-groups]
# What CI installs (`uv sync --no-default-groups --group test`, resp. `docs`).
# Keeping these apart from `dev` spares CI the interactive tools -- in
# particular `pdbpp`, which shadows the stdlib `pdb` that both pytest and
# `doctest` import, so an interpreter it dislikes breaks *collection*.
test = ["pytest>=7.1.3,<8"]
docs = ["pdoc>=14.2,<15"]
# The default group, i.e. plain `uv sync`: the above, plus the tools for
# working on the code by hand.
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "ipython",
    "pre-commit>=2.20,<3",
    "pdbpp>=0.10.3",
    "ruff",
    "ty",
    "ipdb>=0.13.9,<0.14",
]

[build-system]
requires = ["uv_build>=0.9.18,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package is at the repo root (uv_build defaults to src-layout)
module-name = "TPFA_ResSim"
module-root = ""


# ╔═════════╗
# ║ Linting ║
# ╚═════════╝
[tool.autopep8]
max_line_length = 88
ignore = "W6"

[tool.ruff]
line-length = 88

[tool.ruff.format]
exclude = ["tests/*", "examples/*"]

[tool.ruff.lint]
# Pinned to the classic pyflakes + pycodestyle-errors selection (the coverage
# of the old flakeheaven config). Notably, this excludes the whitespace (E1,
# E2) and blank-line (E3) rules, so as to allow operator/array alignment.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F401", # imported but unused
    "E731", # don't assign lambda
]


# ╔═════════╗
# ║ Testing ║
# ╚═════════╝
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "tests --doctest-modules TPFA_ResSim"
# The examples are run (as regression tests) by tests/test_examples.py
filterwarnings = ["ignore:Animation was deleted:UserWarning"]
