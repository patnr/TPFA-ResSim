[project]
name = "minires"
version = "0.2.0"
description = "Toy petroleum reservoir simulator using TPFA."
authors = [{name = "patnr", email = "patrick.n.raanes@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "reservoir-simulation",
    "reservoir-engineering",
    "petroleum",
    "porous-media",
    "two-phase-flow",
    "waterflooding",
    "darcy",
    "finite-volume",
    "tpfa",
    "adjoint",
    "history-matching",
    "data-assimilation",
]
# NB: no `License ::` classifier -- PEP 639 forbids it alongside the SPDX
# `license` field above, and PyPI rejects the combination.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Try to keep compatible with Colab's environment, w/o needed many re-installs
# (its runtime of 2026.07 uses Python 3.12)
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "scipy~=1.10",
    "tqdm~=4.65",
    "mpl-tools>=0.4.0,<0.5",
]

# The PyPI sidebar. `Homepage` is the docs (whose index redirects to the
# package page), not the repo, which `Repository` covers.
[project.urls]
Homepage = "https://patnr.github.io/MiniRes/"
Documentation = "https://patnr.github.io/MiniRes/minires.html"
Repository = "https://github.com/patnr/MiniRes"
Changelog = "https://github.com/patnr/MiniRes/blob/main/CHANGELOG.md"
Issues = "https://github.com/patnr/MiniRes/issues"

[dependency-groups]
# What CI installs (`uv sync --no-default-groups --group test`, resp. `docs`).
# Keeping these apart from `dev` spares CI the interactive tools -- in
# particular `pdbpp`, which shadows the stdlib `pdb` that both pytest and
# `doctest` import, so an interpreter it dislikes breaks *collection*.
test = ["pytest>=7.1.3,<8"]
docs = ["pdoc>=16,<17"]
# The default group, i.e. plain `uv sync`: the above, plus the tools for
# working on the code by hand.
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "ipython",
    "pre-commit>=2.20,<3",
    "pdbpp>=0.10.3",
    "ruff",
    "ty",
    "ipdb>=0.13.9,<0.14",
]

[build-system]
requires = ["uv_build>=0.9.18,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package is at the repo root (uv_build defaults to src-layout)
module-name = "minires"
module-root = ""


# ╔═════════╗
# ║ Linting ║
# ╚═════════╝
[tool.autopep8]
max_line_length = 88
ignore = "W6"

[tool.ruff]
line-length = 88

[tool.ruff.format]
exclude = ["tests/*", "examples/*"]

[tool.ruff.lint]
# Pinned to the classic pyflakes + pycodestyle-errors selection (the coverage
# of the old flakeheaven config). Notably, this excludes the whitespace (E1,
# E2) and blank-line (E3) rules, so as to allow operator/array alignment.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F401", # imported but unused
    "E731", # don't assign lambda
]


# ╔═════════╗
# ║ Testing ║
# ╚═════════╝
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "tests --doctest-modules minires"
# The examples are run (as regression tests) by tests/test_examples.py
filterwarnings = ["ignore:Animation was deleted:UserWarning"]
